name: Build MinGW ARM64 cross-compile image

on:
  push:
    branches:
      - master
    paths:
      - 'arm64/**'
      - 'deps/**'
      - 'patch/**'
      - '.github/workflows/build-image-arm64.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/swi-prolog/swipl-mingw-build-arm64

jobs:
  build:
    # The image cross-compiles for Windows ARM64 but runs ARM64 Windows PE
    # host tools under Wine during the build, which needs a native aarch64
    # kernel with 4K pages.  GitHub's hosted arm runners provide this.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: arm64/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:cache
          cache-to: type=registry,ref=${{ env.IMAGE }}:cache,mode=max
