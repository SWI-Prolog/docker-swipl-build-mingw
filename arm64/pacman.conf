# pacman configuration for installing MSYS2 CLANGARM64 packages into
# /opt/msys from Fedora's pacman.  Used only during the image build.

[options]
RootDir     = /opt/msys
DBPath      = /opt/msys/var/lib/pacman/
CacheDir    = /opt/msys/var/cache/pacman/pkg/
LogFile     = /opt/msys/var/log/pacman.log
GPGDir      = /opt/msys/etc/pacman.d/gnupg/
HookDir     = /opt/msys/etc/pacman.d/hooks/
Architecture = any
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
# The MSYS2 mirrors answer bursts of parallel requests with HTTP 429.
ParallelDownloads = 1
# pacman 7's download sandbox (landlock, privilege drop) does not work in
# a container build.
DisableSandbox

[clangarm64]
Server = https://mirror.msys2.org/mingw/clangarm64/
Server = https://repo.msys2.org/mingw/clangarm64/
Server = https://mirrors.kernel.org/msys2/mingw/clangarm64/
